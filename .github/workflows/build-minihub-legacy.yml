name: Build MiniHub Legacy ARMv7

on:
  workflow_dispatch:
  push:
    paths:
      - "MiniHubLegacy/**"
      - ".github/workflows/build-minihub-legacy.yml"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bash curl git make perl unzip zip xz-utils \
            file fakeroot dpkg libtinfo6 ca-certificates bzip2 imagemagick

      - name: Install Theos
        env:
          CI: "1"
          THEOS: ${{ github.workspace }}/theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/toolchain"
          curl -fL \
            https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz \
            | tar -xJ -C "$THEOS/toolchain"

      - name: Install iOS 9.2 SDK
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          set -euxo pipefail
          mkdir -p "$THEOS/sdks"
          curl -fL \
            https://raw.githubusercontent.com/Sn0wCooder/theos-sdks/master/iPhoneOS9.2.sdk.tbz2 \
            -o /tmp/iPhoneOS9.2.sdk.tbz2
          tar -xjf /tmp/iPhoneOS9.2.sdk.tbz2 -C "$THEOS/sdks"
          test -d "$THEOS/sdks/iPhoneOS9.2.sdk"
          echo "SDK installed:"
          ls -la "$THEOS/sdks/iPhoneOS9.2.sdk" | head

      - name: Prepare Chrome-style legacy iPad icons
        run: |
          set -euxo pipefail
          SRC="MiniHubLegacy/Resources/Icon-76.png"
          test -f "$SRC"

          # Same filename pattern used by Chrome 63 on iOS 9.
          convert "$SRC" -background white -alpha remove -alpha off -resize 29x29!   MiniHubLegacy/Resources/AppIcon29x29~ipad.png
          convert "$SRC" -background white -alpha remove -alpha off -resize 58x58!   MiniHubLegacy/Resources/AppIcon29x29@2x~ipad.png
          convert "$SRC" -background white -alpha remove -alpha off -resize 40x40!   MiniHubLegacy/Resources/AppIcon40x40~ipad.png
          convert "$SRC" -background white -alpha remove -alpha off -resize 80x80!   MiniHubLegacy/Resources/AppIcon40x40@2x~ipad.png
          convert "$SRC" -background white -alpha remove -alpha off -resize 76x76!   MiniHubLegacy/Resources/AppIcon76x76~ipad.png
          convert "$SRC" -background white -alpha remove -alpha off -resize 152x152! MiniHubLegacy/Resources/AppIcon76x76@2x~ipad.png
          convert "$SRC" -background white -alpha remove -alpha off -resize 167x167! MiniHubLegacy/Resources/AppIcon83.5x83.5@2x~ipad.png

          # Fallback names for older icon lookup paths.
          cp MiniHubLegacy/Resources/AppIcon29x29~ipad.png MiniHubLegacy/Resources/AppIcon29x29.png
          cp MiniHubLegacy/Resources/AppIcon40x40~ipad.png MiniHubLegacy/Resources/AppIcon40x40.png
          cp MiniHubLegacy/Resources/AppIcon76x76~ipad.png MiniHubLegacy/Resources/AppIcon76x76.png

          file MiniHubLegacy/Resources/AppIcon*.png

      - name: Build ARMv7 app
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          set -euxo pipefail
          cd MiniHubLegacy
          make clean
          make FINALPACKAGE=1
          make stage FINALPACKAGE=1

      - name: Verify ARMv7 binary
        run: |
          set -euxo pipefail
          APP="$(find MiniHubLegacy/.theos/_ -type d -name 'MiniHub.app' -print -quit)"
          test -n "$APP"
          test -f "$APP/MiniHub"
          echo "App: $APP"
          file "$APP/MiniHub"
          file "$APP/MiniHub" | grep -Ei 'arm|Mach-O'

      - name: Create IPA
        run: |
          set -euxo pipefail
          rm -rf dist
          mkdir -p dist/Payload
          APP="$(find MiniHubLegacy/.theos/_ -type d -name 'MiniHub.app' -print -quit)"
          cp -a "$APP" dist/Payload/MiniHub.app
          (cd dist && zip -qry MiniHub-Legacy-iOS9-ARMv7.ipa Payload)
          ls -lh dist/MiniHub-Legacy-iOS9-ARMv7.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MiniHub-Legacy-iOS9-ARMv7
          path: dist/MiniHub-Legacy-iOS9-ARMv7.ipa
          if-no-files-found: error
